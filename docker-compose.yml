services:
  db:
    image: postgres:17
    container_name: homelab_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: homelab_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Local SLM for the planner /todos/parse path (calendar-todo feature).
  # Published on 127.0.0.1 only; the host-networked api reaches it at
  # localhost:11434 (matches OLLAMA_HOST default). No GPU on the M710q — CPU only.
  ollama:
    image: ollama/ollama:latest
    container_name: homelab_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Unload the ~2.3 GB model when idle so it does not permanently hold RAM
      # alongside Postgres + the api on the 8 GB box (M-3 / NFR-5).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # Serialize model work — one request at a time protects the 8 GB box.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # Cap RAM so Ollama + model cannot starve Postgres/api/sampler into OOM.
    # qwen2.5:3b-instruct (~2.3 GB weights) fits comfortably under 4 GB.
    mem_limit: 4g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    build: .
    container_name: homelab_api
    restart: unless-stopped
    # host network so psutil sees the machine's real NICs and hostname; listens on 127.0.0.1:8000 only
    network_mode: host
    env_file: .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      DOCKER_HOST: tcp://127.0.0.1:2375
    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      # Not required for boot: if Ollama is down the app still starts and only
      # /todos/parse returns 503 (graceful degrade, NFR-7/14/17). We wait for it
      # to have started so the parse path is usable once the model is pulled.
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homelab_cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
