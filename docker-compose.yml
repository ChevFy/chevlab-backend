services:
  db:
    image: postgres:17
    container_name: homelab_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: homelab_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: .
    container_name: homelab_api
    restart: unless-stopped
    # host network so psutil sees the machine's real NICs and hostname; listens on 127.0.0.1:8000 only
    network_mode: host
    env_file: .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      DOCKER_HOST: tcp://127.0.0.1:2375
    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homelab_cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  postgres_data:
